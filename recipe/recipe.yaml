# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 1.5.2

package:
  name: assemblyai
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/assemblyai/assemblyai-${{ version }}.tar.gz
  sha256: f1092270345bf4af2271eb00b1c42e041c687aae8524da6058a89fe411001fdb

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - httpx >=0.19.0
    - pydantic >=1.10.17
    - typing_extensions >=3.7
    - websockets >=11.0
tests:
  - python:
      imports:
        - assemblyai
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://pypi.org/project/assemblyai/
  license: MIT
  license_file: LICENSE
  summary: AssemblyAI Python SDK
  repository: https://github.com/AssemblyAI/assemblyai-python-sdk
  documentation: https://github.com/AssemblyAI/assemblyai-python-sdk/blob/master/README.md
  description: |
    AssemblyAI's Python SDK provides access to speech-to-text,
    audio intelligence, and LeMUR models for transcribing and
    analyzing audio.

extra:
  recipe-maintainers:
    - pb01ka
    - rxm7706
